[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmbert-boundary"
version = "0.1.0"
description = "Fine-tune mmBERT for Tibetan text boundary detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.14.0",
    "pyarrow>=12.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "wandb>=0.17.0",
]

[project.scripts]
mmbert-boundary = "mmbert_boundary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
